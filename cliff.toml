# Renders CHANGELOG.md and computes the next version from the commit subjects.
# `pdm run changelog` / `pdm run next-version`.

[changelog]
header = """
# Changelog

Every released version of apiadapters, newest first, generated by
`pdm run changelog` from the commit history. Do not edit by hand.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {{ commit.message | upper_first }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% if commit.breaking and commit.body %}
{{ commit.body | indent(prefix="  ", first=true) }}

{% endif %}\
{% endfor %}\
{% endfor %}

"""
trim = true

[git]
conventional_commits = true
# Drops `initial commit`, the one subject predating the prefix convention.
filter_unconventional = true
tag_pattern = "v[0-9]*"
commit_parsers = [
  # The release commit this script makes is bookkeeping, not a change.
  { message = "^docs: changelog for", skip = true },
  { message = "^\\w+(\\(.+\\))?!:", group = "<!-- 0 -->Breaking" },
  { message = "^feat",              group = "<!-- 1 -->Added" },
  { message = "^fix",               group = "<!-- 2 -->Fixed" },
  { message = "^perf",              group = "<!-- 3 -->Performance" },
  { message = "^refactor",          group = "<!-- 4 -->Changed" },
  { message = "^(build|chore|test|docs|ci)", group = "<!-- 5 -->Internal" },
]

[bump]
# apiadapters is 0.x: a break bumps the minor. The default would take the
# first `!` commit to 1.0.0, asserting a stability the package has not
# claimed.
breaking_always_bump_major = false
