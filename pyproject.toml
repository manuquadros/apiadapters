[project]
name = "apiadapters"
dynamic = ["version"]
description = "API adapters for services external and internal to D3"
readme = "README.md"
requires-python = ">=3.12, <4"
license = "GPL-3.0-or-later"
dependencies = [
  "cacheout>=0.16.0",
  "httpx>=0.28.1",
  "lxml>=5.3.2",
  "pandas>=2.3.2",
  "pydantic>=2.13.5",
  "tenacity>=9.1.2",
  "xmlparser @ git+https://github.com/manuquadros/xmlparser.git@master",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.1.0",
  "git-cliff>=2.13.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
# xmlparser is a git dependency pinned to a branch, not a PyPI release (see
# AGENTS.md); hatchling refuses to build direct-reference dependencies
# without this.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/apiadapters"]

[tool.pdm.scripts]
changelog = "git-cliff --output CHANGELOG.md"
next-version = "git-cliff --bumped-version"
release = "python scripts/release.py"
