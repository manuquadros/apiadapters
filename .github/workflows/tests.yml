name: Tests

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pdm install

      - name: Run unit tests
        run: pdm run pytest tests/

      - name: Check requirements.txt is up to date
        run: |
          pdm export --no-hashes -o /tmp/requirements.txt
          if ! diff -q /tmp/requirements.txt requirements.txt > /dev/null; then
            echo "::error::requirements.txt is out of date. Run 'pdm export --no-hashes -o requirements.txt' and commit the result."
            exit 1
          fi
